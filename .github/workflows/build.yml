name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: android/AstraeusTracker
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/AstraeusTracker/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S pc/AstraeusPoseViewer -B build/pc -A x64
      - run: cmake --build build/pc --config Release
      - run: ctest --test-dir build/pc -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: windows-viewer
          path: build/pc/Release/AstraeusPoseViewer.exe
